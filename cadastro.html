<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | Registre sua Experiência</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="pagina-cadastro">

        <section class="cadastro">

            <p class="subtitulo">
                REGISTRE SUA EXPERIÊNCIA
            </p>

            <h1>
                Antes de começar
            </h1>

            <p class="descricao">
                Preencha seus dados para participar da experiência.
            </p>

            <form id="formularioCadastro">

                <div class="campo">

                    <label for="nome">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>

                <div class="campo">

                    <label for="escola">
                        Escola
                    </label>

                    <input
                        type="text"
                        id="escola"
                        name="escola"
                        placeholder="Digite o nome da sua escola"
                        required
                    >

                </div>

                <div class="campo">

                    <label for="serie">
                        Série
                    </label>

                    <input
                        type="text"
                        id="serie"
                        name="serie"
                        placeholder="Ex.: 9º ano"
                        required
                    >

                </div>

                <div class="campo">

                    <label for="telefone">
                        Telefone
                    </label>

                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="(00) 00000-0000"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="botao"
                >
                    CONTINUAR
                </button>

            </form>

        </section>

    </main>

   <script src="Js/app.js"></script>

</body>

</html>
